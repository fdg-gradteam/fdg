<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استخراج النص من الملفات - OCR</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6ec; --accent: #2563eb; --accent-soft: #e8efff; --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  .drop {
    display: block;
    border: 2px dashed var(--border); border-radius: 14px; background: var(--card);
    padding: 40px 20px; text-align: center; cursor: pointer; transition: .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; font-size: 18px; margin-bottom: 6px; }
  .drop span { color: var(--muted); font-size: 14px; }
  input[type=file] { display: none; }

  .list { margin: 16px 0 0; padding: 0; list-style: none; }
  .list li { display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
  .list button { border: 0; background: none; color: var(--danger); cursor: pointer; font-size: 16px; }

  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { border: 0; border-radius: 8px; padding: 11px 22px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-light { background: var(--card); border: 1px solid var(--border); color: var(--text); }

  .status { margin-top: 16px; color: var(--muted); display: none; align-items: center; gap: 10px; }
  .spinner { width: 18px; height: 18px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-top: 20px; overflow: hidden; }
  .result header { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .result header h3 { margin: 0; font-size: 16px; word-break: break-all; }
  .result header .tools { display: flex; gap: 6px; }
  .result header .tools button { font-size: 13px; padding: 6px 12px; }
  .result textarea { width: 100%; min-height: 260px; border: 0; padding: 16px; font-size: 15px;
    line-height: 1.8; font-family: inherit; resize: vertical; color: var(--text); background: transparent; unicode-bidi: plaintext; }
  .result textarea:focus { outline: none; }
  .result .err { color: var(--danger); padding: 16px; margin: 0; white-space: pre-wrap; }
  .meta { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>استخراج النص من الملفات</h1>
  <p class="sub">ارفع صور أو ملفات PDF وسيتم استخراج النص منها باستخدام Google Vision OCR</p>

  <label class="drop" id="drop">
    <strong>اسحب الملفات هنا أو اضغط للاختيار</strong>
    <span>PNG · JPG · WEBP · TIFF · BMP · GIF · PDF — حتى 25 ميجابايت</span>
    <input type="file" id="fileInput" multiple accept="image/*,.pdf,.tif,.tiff">
  </label>

  <ul class="list" id="fileList"></ul>

  <div class="actions">
    <button class="btn btn-primary" id="runBtn" disabled>استخراج النص</button>
    <button class="btn btn-light" id="clearBtn">مسح الكل</button>
  </div>

  <div class="status" id="status"><div class="spinner"></div><span>جاري استخراج النص...</span></div>

  <div id="results"></div>
</div>

<script>
const drop = document.getElementById('drop');
const input = document.getElementById('fileInput');
const listEl = document.getElementById('fileList');
const runBtn = document.getElementById('runBtn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
let files = [];

function renderList() {
  listEl.innerHTML = '';
  files.forEach((f, i) => {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.textContent = `${f.name} (${(f.size / 1024).toFixed(0)} KB)`;
    const rm = document.createElement('button');
    rm.textContent = '✕'; rm.title = 'إزالة';
    rm.onclick = (e) => { e.preventDefault(); files.splice(i, 1); renderList(); };
    li.append(name, rm);
    listEl.appendChild(li);
  });
  runBtn.disabled = files.length === 0;
}

function addFiles(fl) { files.push(...fl); renderList(); }

input.addEventListener('change', () => { addFiles(input.files); input.value = ''; });
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

document.getElementById('clearBtn').onclick = () => { files = []; renderList(); resultsEl.innerHTML = ''; };

function download(name, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/\.[^.]+$/, '') + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

function renderResult(r) {
  const card = document.createElement('div');
  card.className = 'result';
  const header = document.createElement('header');
  const h = document.createElement('h3');
  h.textContent = r.filename;
  header.appendChild(h);

  if (r.error) {
    card.appendChild(header);
    const p = document.createElement('p');
    p.className = 'err'; p.textContent = r.error;
    card.appendChild(p);
    return card;
  }

  const meta = document.createElement('span');
  meta.className = 'meta';
  meta.textContent = `${r.pages.length} صفحة · ${r.text.length} حرف`;
  h.appendChild(document.createElement('br'));
  h.appendChild(meta);

  const tools = document.createElement('div');
  tools.className = 'tools';
  const ta = document.createElement('textarea');
  ta.value = r.text || '(لم يتم العثور على نص)';

  const copy = document.createElement('button');
  copy.className = 'btn btn-light'; copy.textContent = 'نسخ';
  copy.onclick = async () => { await navigator.clipboard.writeText(ta.value); copy.textContent = 'تم النسخ ✓'; setTimeout(() => copy.textContent = 'نسخ', 1500); };
  const dl = document.createElement('button');
  dl.className = 'btn btn-light'; dl.textContent = 'تحميل TXT';
  dl.onclick = () => download(r.filename, ta.value);

  tools.append(copy, dl);
  header.appendChild(tools);
  card.append(header, ta);
  return card;
}

runBtn.onclick = async () => {
  const fd = new FormData();
  files.forEach(f => fd.append('files', f));
  runBtn.disabled = true;
  statusEl.style.display = 'flex';
  resultsEl.innerHTML = '';
  try {
    const res = await fetch('/api/ocr', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    data.results.forEach(r => resultsEl.appendChild(renderResult(r)));
  } catch (err) {
    resultsEl.appendChild(renderResult({ filename: 'خطأ', error: err.message }));
  } finally {
    statusEl.style.display = 'none';
    runBtn.disabled = files.length === 0;
  }
};
</script>
</body>
</html>
